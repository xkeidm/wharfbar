<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Abstract mooring ring with bar">
  <title>v2.06 — Mooring Ring</title>
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#DCE5EF"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#m-bg)"/>
  <!-- Continuous stroke: top bar into ring (rope/mooring) -->
  <path
    d="M36 40 H92
       M64 40 V52
       A22 22 0 1 1 63.9 52"
    fill="none"
    stroke="#16324F"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- Inner accent dot -->
  <circle cx="64" cy="74" r="6" fill="#5B8FB8"/>
</svg>
