<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Jetty extending from shore">
  <title>v3.05 — Jetty</title>
  <defs>
    <linearGradient id="j-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF1F7"/>
      <stop offset="100%" stop-color="#C9D9E9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#j-bg)"/>
  <!-- Shore mass left -->
  <path d="M18 24 V104 H40 V24 Z" fill="#16324F"/>
  <!-- Narrow jetty going out -->
  <rect x="40" y="58" width="62" height="12" rx="2" fill="#2B4A6F"/>
  <!-- End platform (landing) -->
  <rect x="90" y="52" width="18" height="24" rx="3" fill="#16324F"/>
  <!-- Two piles near end -->
  <rect x="70" y="70" width="5" height="22" rx="1.5" fill="#3D5F86"/>
  <rect x="96" y="76" width="5" height="18" rx="1.5" fill="#3D5F86"/>
</svg>
