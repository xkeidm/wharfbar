<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Port seal: circle with pier">
  <title>v2.03 — Port Mark</title>
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#DCE5EF"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#p-bg)"/>
  <!-- Outer ring (distro seal feel) -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#16324F" stroke-width="7"/>
  <!-- Inner pier: top bar + deck + posts -->
  <rect x="42" y="44" width="44" height="5" rx="2.5" fill="#5B8FB8"/>
  <rect x="46" y="62" width="36" height="7" rx="2" fill="#16324F"/>
  <rect x="50" y="69" width="4" height="14" rx="1" fill="#16324F"/>
  <rect x="62" y="69" width="4" height="14" rx="1" fill="#16324F"/>
  <rect x="74" y="69" width="4" height="14" rx="1" fill="#16324F"/>
</svg>
