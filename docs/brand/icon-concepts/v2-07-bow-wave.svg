<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Abstract bow and wave">
  <title>v2.07 — Bow Wave</title>
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#DCE5EF"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#b-bg)"/>
  <!-- Soft wave bands -->
  <path d="M24 78 C44 66, 84 90, 104 78" fill="none" stroke="#A8C4DE" stroke-width="6" stroke-linecap="round"/>
  <path d="M28 90 C48 78, 80 102, 100 90" fill="none" stroke="#6FA0C8" stroke-width="6" stroke-linecap="round"/>
  <!-- Floating top bar / vessel deck -->
  <rect x="34" y="44" width="60" height="10" rx="5" fill="#16324F"/>
  <rect x="42" y="54" width="44" height="8" rx="3" fill="#3D6A94"/>
</svg>
