<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="WharfBar icon concept C: mooring bollard">
  <title>C — Mooring Bollard</title>
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8EEF5"/>
      <stop offset="100%" stop-color="#D5DEE9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#c-bg)"/>
  <!-- Thin top-bar nod -->
  <rect x="44" y="28" width="40" height="5" rx="2.5" fill="#1F3A5F" opacity="0.55"/>
  <!-- Bollard body -->
  <rect x="52" y="48" width="24" height="44" rx="6" fill="#2B4A6F"/>
  <!-- Bollard cap -->
  <ellipse cx="64" cy="48" rx="16" ry="8" fill="#1F3A5F"/>
  <ellipse cx="64" cy="46" rx="12" ry="5" fill="#3D5F86"/>
  <!-- Mooring ring -->
  <circle cx="64" cy="72" r="10" fill="none" stroke="#7BA3C9" stroke-width="4"/>
  <!-- Base flange -->
  <ellipse cx="64" cy="94" rx="22" ry="7" fill="#3D5F86"/>
  <ellipse cx="64" cy="92" rx="16" ry="4" fill="#2B4A6F"/>
</svg>
