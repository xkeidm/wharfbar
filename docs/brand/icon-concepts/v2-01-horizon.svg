<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Horizon mark">
  <title>v2.01 — Horizon</title>
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#DCE5EF"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#h-bg)"/>
  <!-- Top bar -->
  <rect x="30" y="38" width="68" height="7" rx="3.5" fill="#16324F"/>
  <!-- Soft gap = sky -->
  <!-- Dock / pier as single thick rounded bar -->
  <rect x="38" y="72" width="52" height="14" rx="7" fill="#16324F"/>
  <!-- Water ripple -->
  <path d="M42 98h44" stroke="#6FA0C8" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
</svg>
