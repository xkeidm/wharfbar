<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Cargo wharf with crane hint">
  <title>v3.07 — Cargo Wharf</title>
  <defs>
    <linearGradient id="cw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF1F7"/>
      <stop offset="100%" stop-color="#D4E0EC"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#cw-bg)"/>
  <!-- Deck -->
  <rect x="24" y="78" width="80" height="10" rx="2" fill="#16324F"/>
  <!-- Piles -->
  <rect x="34" y="88" width="5" height="14" rx="1" fill="#3D5F86"/>
  <rect x="74" y="88" width="5" height="14" rx="1" fill="#3D5F86"/>
  <!-- Simple crane: mast + jib (loading/unloading = wharf purpose) -->
  <rect x="40" y="34" width="6" height="44" rx="1.5" fill="#16324F"/>
  <rect x="40" y="36" width="44" height="6" rx="1.5" fill="#16324F"/>
  <!-- Hook line -->
  <path d="M78 42 V62" stroke="#5B8FB8" stroke-width="3" stroke-linecap="round"/>
  <rect x="72" y="62" width="12" height="8" rx="2" fill="#5B8FB8"/>
</svg>
