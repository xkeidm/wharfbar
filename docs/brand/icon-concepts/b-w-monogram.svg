<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="WharfBar icon concept B: W monogram with pier plank">
  <title>B — W Monogram</title>
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8EEF5"/>
      <stop offset="100%" stop-color="#D5DEE9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#b-bg)"/>
  <!-- Stylized W; middle valley reads as a pier plank -->
  <path
    d="M28 40 L42 92 L54 58 L64 78 L74 58 L86 92 L100 40"
    fill="none"
    stroke="#1F3A5F"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- Pier plank accent through the middle valley -->
  <rect x="48" y="74" width="32" height="6" rx="3" fill="#5B8FB8"/>
</svg>
