<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" role="img" aria-label="Wharf word-meaning icon concepts">
  <title>Wharf = rıhtım — literal icon set</title>
  <rect width="620" height="540" fill="#F4F7FB"/>
  <text x="310" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="#16324F">wharf = rıhtım / gemilerin yanaştığı yapı</text>
  <text x="310" y="52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#5B6B7C">kelime anlamına dayalı vektör ikonlar</text>

  <!-- 01 Classic -->
  <g transform="translate(28,76)">
    <rect width="128" height="128" rx="28" fill="#DCE7F1"/>
    <rect x="22" y="28" width="18" height="72" rx="3" fill="#16324F"/>
    <rect x="40" y="48" width="58" height="8" rx="1.5" fill="#2B4A6F"/>
    <rect x="40" y="58" width="58" height="8" rx="1.5" fill="#3D5F86"/>
    <rect x="40" y="68" width="50" height="8" rx="1.5" fill="#2B4A6F"/>
    <rect x="52" y="76" width="5" height="20" rx="1.5" fill="#16324F"/>
    <rect x="68" y="76" width="5" height="20" rx="1.5" fill="#16324F"/>
    <rect x="84" y="76" width="5" height="20" rx="1.5" fill="#16324F"/>
    <path d="M44 102 C58 96, 78 108, 104 100" fill="none" stroke="#6FA0C8" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
    <text x="64" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#16324F">01 Classic Wharf</text>
    <text x="64" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5B6B7C">kıyı + plank + kazık</text>
  </g>

  <!-- 02 Side -->
  <g transform="translate(172,76)">
    <rect width="128" height="128" rx="28" fill="#DCE7F1"/>
    <rect x="24" y="52" width="80" height="12" rx="2" fill="#16324F"/>
    <rect x="32" y="64" width="7" height="28" rx="2" fill="#2B4A6F"/>
    <rect x="50" y="64" width="7" height="32" rx="2" fill="#2B4A6F"/>
    <rect x="68" y="64" width="7" height="28" rx="2" fill="#2B4A6F"/>
    <rect x="86" y="64" width="7" height="34" rx="2" fill="#2B4A6F"/>
    <path d="M28 100 H100" stroke="#7BA3C9" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <text x="64" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#16324F">02 Side View</text>
    <text x="64" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5B6B7C">iskele profili</text>
  </g>

  <!-- 03 Berth -->
  <g transform="translate(316,76)">
    <rect width="128" height="128" rx="28" fill="#DCE7F1"/>
    <path d="M26 36 V92 H102" fill="none" stroke="#16324F" stroke-width="10" stroke-linecap="square"/>
    <path d="M48 58 H94 L88 78 H42 Z" fill="#3D6A94"/>
    <rect x="54" y="46" width="8" height="14" rx="1" fill="#16324F"/>
    <rect x="70" y="50" width="18" height="10" rx="2" fill="#5B8FB8"/>
    <text x="64" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#16324F">03 Berth</text>
    <text x="64" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5B6B7C">rıhtıma yanaşan gemi</text>
  </g>

  <!-- 04 Quay -->
  <g transform="translate(460,76)">
    <rect width="128" height="128" rx="28" fill="#8EB6D4"/>
    <rect width="128" height="58" fill="#16324F"/>
    <rect y="52" width="128" height="8" fill="#5B8FB8"/>
    <rect x="58" y="28" width="12" height="24" rx="3" fill="#EAF1F7"/>
    <ellipse cx="64" cy="28" rx="10" ry="5" fill="#D4E0EC"/>
    <path d="M24 84 H104" stroke="#EAF1F7" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <text x="64" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#16324F">04 Quay Edge</text>
    <text x="64" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5B6B7C">kenar + bollard</text>
  </g>

  <!-- 05 Jetty -->
  <g transform="translate(28,292)">
    <rect width="128" height="128" rx="28" fill="#DCE7F1"/>
    <path d="M18 24 V104 H40 V24 Z" fill="#16324F"/>
    <rect x="40" y="58" width="62" height="12" rx="2" fill="#2B4A6F"/>
    <rect x="90" y="52" width="18" height="24" rx="3" fill="#16324F"/>
    <rect x="70" y="70" width="5" height="22" rx="1.5" fill="#3D5F86"/>
    <rect x="96" y="76" width="5" height="18" rx="1.5" fill="#3D5F86"/>
    <text x="64" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#16324F">05 Jetty</text>
    <text x="64" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5B6B7C">denize uzanan iskele</text>
  </g>

  <!-- 06 Glyph -->
  <g transform="translate(172,292)">
    <rect width="128" height="128" rx="28" fill="#DCE7F1"/>
    <rect x="28" y="44" width="72" height="14" rx="3" fill="#16324F"/>
    <rect x="36" y="58" width="8" height="30" rx="2" fill="#16324F"/>
    <rect x="60" y="58" width="8" height="30" rx="2" fill="#16324F"/>
    <rect x="84" y="58" width="8" height="30" rx="2" fill="#16324F"/>
    <text x="64" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#16324F">06 Wharf Glyph</text>
    <text x="64" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5B6B7C">sözlük piktogramı ★</text>
  </g>

  <!-- 07 Cargo -->
  <g transform="translate(316,292)">
    <rect width="128" height="128" rx="28" fill="#DCE7F1"/>
    <rect x="24" y="78" width="80" height="10" rx="2" fill="#16324F"/>
    <rect x="34" y="88" width="5" height="14" rx="1" fill="#3D5F86"/>
    <rect x="74" y="88" width="5" height="14" rx="1" fill="#3D5F86"/>
    <rect x="40" y="34" width="6" height="44" rx="1.5" fill="#16324F"/>
    <rect x="40" y="36" width="44" height="6" rx="1.5" fill="#16324F"/>
    <path d="M78 42 V62" stroke="#5B8FB8" stroke-width="3" stroke-linecap="round"/>
    <rect x="72" y="62" width="12" height="8" rx="2" fill="#5B8FB8"/>
    <text x="64" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#16324F">07 Cargo Wharf</text>
    <text x="64" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5B6B7C">yükleme / vinç</text>
  </g>

  <!-- 08 Dictionary seal -->
  <g transform="translate(460,292)">
    <rect width="128" height="128" rx="28" fill="#DCE7F1"/>
    <circle cx="64" cy="64" r="42" fill="none" stroke="#16324F" stroke-width="5"/>
    <rect x="34" y="40" width="10" height="48" rx="2" fill="#16324F"/>
    <rect x="44" y="56" width="40" height="9" rx="2" fill="#16324F"/>
    <rect x="52" y="65" width="5" height="16" rx="1" fill="#3D5F86"/>
    <rect x="66" y="65" width="5" height="16" rx="1" fill="#3D5F86"/>
    <path d="M50 90 C56 86, 62 94, 68 90" fill="none" stroke="#6FA0C8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="64" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#16324F">08 Dictionary</text>
    <text x="64" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5B6B7C">mühür + pier</text>
  </g>
</svg>
