<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Solid tile with cutout pier">
  <title>v2.08 — Negative Pier</title>
  <defs>
    <linearGradient id="n-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#DCE5EF"/>
    </linearGradient>
    <mask id="cut">
      <rect width="128" height="128" fill="white"/>
      <!-- Cutouts: top bar + pier silhouette -->
      <rect x="36" y="38" width="56" height="8" rx="4" fill="black"/>
      <rect x="42" y="64" width="44" height="10" rx="2" fill="black"/>
      <rect x="46" y="74" width="6" height="16" rx="1.5" fill="black"/>
      <rect x="61" y="74" width="6" height="16" rx="1.5" fill="black"/>
      <rect x="76" y="74" width="6" height="16" rx="1.5" fill="black"/>
    </mask>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#n-bg)"/>
  <rect x="22" y="22" width="84" height="84" rx="20" fill="#16324F" mask="url(#cut)"/>
</svg>
